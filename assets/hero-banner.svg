<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#111a2c"/>
      <stop offset="55%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .tag { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- HUD corner brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.5">
    <path d="M28,20 L28,44 M28,20 L52,20"/>
    <path d="M1172,20 L1172,44 M1172,20 L1148,20"/>
    <path d="M28,300 L28,276 M28,300 L52,300"/>
    <path d="M1172,300 L1172,276 M1172,300 L1148,300"/>
  </g>

  <!-- sparse static stars -->
  <g fill="#e6edf3" opacity="0.5">
    <circle cx="95" cy="60" r="1.2"/>
    <circle cx="160" cy="130" r="1"/>
    <circle cx="1010" cy="55" r="1.2"/>
    <circle cx="1080" cy="125" r="1"/>
    <circle cx="70" cy="230" r="1"/>
    <circle cx="1120" cy="215" r="1.1"/>
  </g>

  <!-- tracked orbit -->
  <ellipse cx="600" cy="150" rx="380" ry="70" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 6" opacity="0.3"/>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="14s" repeatCount="indefinite" path="M 220,150 A 380 70 0 1 1 980 150 A 380 70 0 1 1 220 150 Z"/>
  </circle>

  <!-- telemetry readouts -->
  <text x="50" y="34" class="tag" font-size="11" fill="#8b949e" letter-spacing="1">MISSION LOG // ARGHYADEVS</text>
  <text x="1150" y="34" text-anchor="end" class="tag" font-size="11" fill="#8b949e" letter-spacing="1">STATUS: ONLINE</text>
  <circle class="pulse" cx="1160" cy="30" r="3.5" fill="#4ade80"/>

  <!-- identity -->
  <text x="600" y="168" text-anchor="middle" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="4">ARGHYADIP PAKHIRA</text>

  <text x="600" y="205" text-anchor="middle" class="tag" font-size="16" fill="#22d3ee" letter-spacing="1">@Arghyadevs · Full-Stack Developer · AI Systems<tspan class="cursor">_</tspan></text>

  <line x1="360" y1="235" x2="840" y2="235" stroke="#1c2333" stroke-width="1"/>

  <text x="600" y="270" text-anchor="middle" class="tag" font-size="11" fill="#8b949e" letter-spacing="2">BASE: INDIA · FOCUS: SHIPPING</text>
</svg>
