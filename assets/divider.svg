<svg viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <circle cx="600" cy="12" r="3" fill="#22d3ee">
    <animate attributeName="r" values="3;4.5;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
